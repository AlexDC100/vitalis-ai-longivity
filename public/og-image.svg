<!-- Vitalis OG/Twitter preview. 1200x630, brand gradient + wordmark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#0F1828"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.18" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#22B8A4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22B8A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FE0C8"/>
      <stop offset="55%" stop-color="#22B8A4"/>
      <stop offset="100%" stop-color="#3DA0F2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Logo mark, scaled from the 64-grid source. Centered vertically. -->
  <g transform="translate(120, 235) scale(2.5)">
    <path d="M20 8 L44 8 L56 24 L56 40 L44 56 L20 56 L8 40 L8 24 Z"
          fill="none" stroke="url(#brand)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M10 34 H22 L26 24 L32 44 L38 28 L42 34 H54"
          fill="none" stroke="url(#brand)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="42" cy="18" r="3.25" fill="url(#brand)"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="320" y="320" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-weight="800" font-size="120" letter-spacing="-3" fill="#FFFFFF">Vitalis</text>
  <text x="320" y="385" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-weight="500" font-size="32" letter-spacing="-0.5" fill="#9BA8B8">
    Your personal longevity OS
  </text>

  <!-- Footer URL -->
  <text x="120" y="565" font-family="Inter, system-ui, -apple-system, sans-serif"
        font-weight="600" font-size="22" letter-spacing="2" fill="url(#brand)">
    VITAL-IS.LIFE
  </text>
</svg>